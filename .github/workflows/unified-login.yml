name: Unified login security
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  identity-contracts:
    name: Focused OIDC and delegated bridge security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/identity.test.js test/service-identity.test.js test/val-bridge.test.js test/unified-machine-bridge.test.js test/unified-oidc.test.js
